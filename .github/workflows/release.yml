name: Release

# Publishes to npm when a version tag is pushed. The tag has no `v` prefix
# because `RNImeTextInput.podspec` resolves its source tag from the package
# version verbatim.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Required reviewers on this environment: a pushed tag waits for a human to
    # approve the run before anything reaches npm.
    environment: npm-publish
    permissions:
      contents: write # to create the GitHub release
      id-token: write # trusted publishing — no NPM_TOKEN, and npm attaches provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # No `registry-url`: it makes setup-node write an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}`, and with trusted publishing there is
          # no such token. npm then authenticates with an empty one and the
          # registry answers 404 — its response for "not authorised" — instead of
          # falling back to OIDC.

      # Trusted publishing needs npm 11.5.1+; the runner ships npm 11.x. Pinned
      # rather than `@latest`: this runs in the job that holds the OIDC token.
      # npm 12 needs Node ^24.15.0, which `node-version: 24` above resolves to.
      - run: npm install -g npm@12.0.2 && npm --version

      - run: npm ci

      # A version can never be republished, so refuse a tag that disagrees with
      # package.json rather than burning the number.
      - name: Check the tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Before publishing, not after: a version can never be republished, so a
      # missing changelog entry should stop the release while that is still free.
      - name: Take the release notes from the changelog
        run: |
          python3 - "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = re.search(
              rf'^## \[{re.escape(version)}\].*?$(.*?)(?=^## |\Z)', changelog, re.S | re.M
          )
          if section is None or not section.group(1).strip():
              sys.exit(f'CHANGELOG.md has no entry for {version}')
          print(section.group(1).strip())
          PY

      - run: npm test
      - run: npm run typecheck

      # `prepare` rebuilds `build/` from scratch as part of publishing.
      - run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
