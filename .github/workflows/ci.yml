name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Typechecks the example against `src`, which is what catches a prop that
      # was added to the native spec but never wired through `TextInput.ios.tsx`.
      - run: npx tsc --noEmit
        working-directory: example
      - run: npm run build

  ios:
    name: iOS build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Regenerates the native project so codegen runs from the spec — the only
      # way a mismatch between the spec and `RNImeTextInput.mm` shows up.
      - run: npx expo prebuild --platform ios --clean
        working-directory: example

      - name: Build
        working-directory: example/ios
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      # The attribute dictionary and the marked-text rules have no JavaScript
      # above them, so this is the only place they are checked at all.
      - name: Native unit tests
        working-directory: example/ios
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in devices.values() for d in runtime if 'iPhone' in d['name']))
          ")
          xcodebuild test \
            -workspace example.xcworkspace \
            -scheme RNImeTextInput \
            -destination "platform=iOS Simulator,id=$udid" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  consumer:
    name: Consumer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `prepare` builds `build/` as part of packing.
      - run: npm pack

      # The example resolves the library to `src`, so it can never catch a fault
      # in what is actually published — 0.1.0 shipped unbundlable because of
      # exactly that. This installs the tarball the way a user would.
      - name: Bundle a plain consumer against the packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cp -R example/App.tsx example/index.ts example/app.json example/tsconfig.json example/assets \
            "$RUNNER_TEMP/consumer/"
          node -e "
            const fs = require('fs');
            const out = process.env.RUNNER_TEMP + '/consumer/';
            const tgz = fs.readdirSync('.').find(f => f.endsWith('.tgz'));
            const pkg = JSON.parse(fs.readFileSync('example/package.json', 'utf8'));
            pkg.name = 'consumer';
            pkg.dependencies['react-native-ime-text-input'] = 'file:' + process.cwd() + '/' + tgz;
            fs.writeFileSync(out + 'package.json', JSON.stringify(pkg, null, 2));
            // The example's config plugin only exists to generate the pod's test
            // target; a plain consumer neither has it nor needs it.
            const app = JSON.parse(fs.readFileSync('example/app.json', 'utf8'));
            delete app.expo.plugins;
            fs.writeFileSync(out + 'app.json', JSON.stringify(app, null, 2));
          "
          cd "$RUNNER_TEMP/consumer"
          npm install --no-audit --no-fund
          npx expo export:embed \
            --platform ios \
            --entry-file index.ts \
            --bundle-output "$RUNNER_TEMP/consumer.jsbundle" \
            --dev false

      # Bundling can succeed while the codegen view config is missing entirely.
      - name: Check the native view config reached the bundle
        run: grep -q textRevision "$RUNNER_TEMP/consumer.jsbundle"
